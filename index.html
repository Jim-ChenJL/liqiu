<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>立秋 · 予你专属浪漫</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  min-height: 100vh;
  overflow: hidden;
  background: linear-gradient(-50deg,#1f1233,#602b75,#d878a0,#ffb396,#733c82);
  background-size: 480% 480%;
  animation: bgTurbo 24s ease-in-out infinite;
  font-family:"Noto Serif SC",serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  position: relative;
  user-select: none;
}
@keyframes bgTurbo {
  0% { background-position:0% 50%; }
  50%{ background-position:100% 50%; }
  100%{background-position:0% 50%;}
}

/* 背景呼吸光晕 */
.breath-orb {
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:radial-gradient(rgba(255,200,230,0.2), transparent 70%);
  filter:blur(60px);
  animation: breathPulse 8s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes breathPulse {
  0% {transform:scale(0.7);opacity:0.3;}
  100%{transform:scale(1.5);opacity:0.55;}
}

.cursor-halo {
  position:fixed;
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(rgba(255,210,235,0.24),transparent 72%);
  filter:blur(45px);
  pointer-events:none;
  transform:translate(-50%,-50%);
  transition:left 0.12s ease, top 0.12s ease;
  z-index:2;
}

/* 霓虹流光文字 */
.neon-shine-title {
  background:linear-gradient(90deg,#fff7d8,#ffb8d8,#dcb8ff,#fff7d8);
  background-size:350% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation: neonFlow 3.2s linear infinite, glowPulse 4s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 16px rgba(255,190,220,0.75));
  transition:transform 0.3s ease, filter 0.3s ease;
}
.neon-shine-title:hover{
  transform:scale(1.06);
  filter:drop-shadow(0 0 26px rgba(255,190,220,0.95));
}
@keyframes neonFlow {
  0%{background-position:0 center;}
  100%{background-position:350% center;}
}
@keyframes glowPulse {
  0%{filter:drop-shadow(0 0 14px rgba(255,190,220,0.6));}
  100%{filter:drop-shadow(0 0 22px rgba(255,200,230,0.9));}
}

/* 入场淡入动画 */
.fadeUpEnter {
  opacity:0;
  transform:translateY(32px);
  animation: fadeUpAnim 2.2s cubic-bezier(0.22,1,0.36,1) forwards;
}
.delay-1 {animation-delay:0.7s;}
.delay-2 {animation-delay:1.8s;}
.delay-3 {animation-delay:2.6s;}
@keyframes fadeUpAnim {
  to {opacity:1;transform:translateY(0);}
}

/* 粒子样式 */
.leaf-particle{
  position:absolute;
  top:-40px;
  pointer-events:none;
  font-size:23px;
  opacity:0.84;
  animation: leafSwingFall linear infinite;
}
@keyframes leafSwingFall{
  0%{top:-30px; transform:translateX(0) rotate(0deg);}
  25%{transform:translateX(40px) rotate(220deg);}
  50%{transform:translateX(-30px) rotate(450deg);}
  75%{transform:translateX(35px) rotate(630deg);}
  100%{top:105vh;transform:translateX(-20px) rotate(820deg);}
}
.star-dust{
  position:absolute;
  pointer-events:none;
  font-size:10px;
  opacity:0.7;
  animation:starTwinkle 3.5s ease-in-out infinite alternate;
}
@keyframes starTwinkle{
  0%{opacity:0.2; transform:translateY(0px);}
  100%{opacity:1; transform:translateY(-22px);}
}
.follow-heart-trail{
  position:absolute;
  pointer-events:none;
  font-size:18px;
  animation: trailFloatUp 1.5s ease-out forwards;
}
@keyframes trailFloatUp{
  0%{opacity:0.9; transform:translateY(0) scale(1);}
  100%{opacity:0; transform:translateY(-80px) scale(0.15);}
}
.burst-heart-firework{
  position:absolute;
  pointer-events:none;
  font-size:22px;
  animation: heartExplode 1.4s ease-out forwards;
}
@keyframes heartExplode{
  0%{opacity:1;transform:scale(1);}
  100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(0.1);}
}
.ripple-wave{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  border:1px solid rgba(255,220,240,0.7);
  pointer-events:none;
  animation: rippleExpand 1.4s ease-out forwards;
}
@keyframes rippleExpand{
  0%{transform:scale(1);opacity:1;}
  100%{transform:scale(26);opacity:0;}
}

.tip-hint{
  position:absolute;
  top:22px;
  background:rgba(255,255,255,0.13);
  backdrop-filter:blur(8px);
  padding:8px 18px;
  border-radius:999px;
  font-size:13px;
  z-index:10;
}
.footer-sign{
  position:absolute;
  bottom:40px;
  letter-spacing:3px;
  text-shadow:0 0 12px rgba(255,230,240,0.5);
  opacity:0.92;
  z-index:10;
}
.content-wrap{
  z-index:5;
  text-align:center;
  padding:0 24px;
}
</style>
</head>
<body>
<div class="breath-orb"></div>
<div class="cursor-halo"></div>
<div class="tip-hint">💖点击唤醒旋律｜单击爱心烟花｜长按爱心喷涌</div>

<div class="content-wrap">
  <h1 class="neon-shine-title text-[clamp(2.7rem,9vw,4.8rem)] fadeUpEnter">立&nbsp;&nbsp;秋</h1>
  <div class="mt-6 neon-shine-title text-[clamp(1.3rem,4vw,2rem)] fadeUpEnter delay-1">
    秋风赴约 · 爱意绵长
  </div>
  <div class="mt-10 fadeUpEnter delay-2 text-[clamp(1rem,3vw,1.4rem)] leading-loose" style="text-shadow:0 1px 8px rgba(0,0,0,0.08)">
    盛夏喧嚣慢慢落幕<br>
    秋风携着温柔奔赴而来<br>
    时光辗转四季轮回<br>
    我对你的爱意只增不减<br>
    愿往后每一个秋天，身旁皆是你 💛
  </div>
  <div class="mt-12 fadeUpEnter delay-3 text-3xl animate-pulse">
    <i class="fa fa-heart"></i>
  </div>
</div>

<div class="footer-sign">✨ 来自 jim 的祝福 ✨</div>

<audio id="bgAudio" loop preload="none">
  <source src="./music.m4a" type="audio/mpeg">


<script>
// 全局配置
const CONFIG = {
  leafInterval:320,
  starInterval:550,
  burstCount:14,
  longPressSpurtInterval:80,
  maxParticleLimit:120
};
let musicPlayState = false;
let longPressTimer = null;
let isLongPress = false;
let particleCount = 0;

const audioEl = document.getElementById('bgAudio');
const cursorHalo = document.querySelector('.cursor-halo');

// 音频播放
function tryPlayMusic(){
  if(musicPlayState) return;
  audioEl.play()
  .then(()=>{
    musicPlayState = true;
  })
  .catch(err=>{
    console.warn("音频播放受限，请放置本地sakura.mp3:",err);
  });
}

//鼠标光晕+拖尾爱心
window.addEventListener('mousemove',(e)=>{
  cursorHalo.style.left = e.clientX + "px";
  cursorHalo.style.top = e.clientY + "px";
  spawnTrailHeart(e.clientX,e.clientY);
});

//生成拖尾爱心
function spawnTrailHeart(x,y){
  if(particleCount > CONFIG.maxParticleLimit) return;
  const heart = document.createElement("span");
  heart.className = "follow-heart-trail";
  const emojiList = ['💖','💗','💕','💞'];
  heart.innerText = emojiList[Math.floor(Math.random()*emojiList.length)];
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  document.body.appendChild(heart);
  particleCount++;
  setTimeout(()=>{
    heart.remove();
    particleCount--;
  },1500);
}

//爱心烟花爆炸
function spawnHeartFirework(x,y){
  for(let i=0;i<CONFIG.burstCount;i++){
    const h = document.createElement("span");
    h.className = "burst-heart-firework";
    const emoji = ['💖','💗','💕','💓'][Math.floor(Math.random()*4)];
    h.innerText = emoji;
    const ang = (Math.PI*2 / CONFIG.burstCount)*i;
    const dist = 70 + Math.random()*90;
    h.style.setProperty('--tx', Math.cos(ang)*dist + "px");
    h.style.setProperty('--ty', Math.sin(ang)*dist + "px");
    h.style.left = x + "px";
    h.style.top = y + "px";
    document.body.appendChild(h);
    particleCount++;
    setTimeout(()=>{
      h.remove();
      particleCount--;
    },1400);
  }
}

//波纹扩散
function spawnRipple(x,y){
  for(let r=0;r<3;r++){
    const ripple = document.createElement("div");
    ripple.className = "ripple-wave";
    ripple.style.left = x + "px";
    ripple.style.top = y + "px";
    ripple.style.animationDelay = (r*0.12)+"s";
    document.body.appendChild(ripple);
    particleCount++;
    setTimeout(()=>{
      ripple.remove();
      particleCount--;
    },1400);
  }
}

//秋叶粒子
function createLeafParticle(){
  const leaf = document.createElement("div");
  leaf.className = "leaf-particle";
  const leafEmoji = ["🍂","🍁","🍃"];
  leaf.innerText = leafEmoji[Math.floor(Math.random()*3)];
  leaf.style.left = Math.random()*100 + "vw";
  const dur = (8 + Math.random()*11)+"s";
  leaf.style.animationDuration = dur;
  document.body.appendChild(leaf);
  particleCount++;
  setTimeout(()=>{
    leaf.remove();
    particleCount--;
  },20000);
}

//闪烁星尘
function createStarDust(){
  const star = document.createElement("div");
  star.className = "star-dust";
  star.innerText = "✦";
  star.style.left = Math.random()*100 + "vw";
  star.style.top = Math.random()*100 + "vh";
  star.style.animationDelay = Math.random()*4+"s";
  document.body.appendChild(star);
  particleCount++;
  setTimeout(()=>{
    star.remove();
    particleCount--;
  },9000);
}

//长按爱心喷泉
function startLongPressSpurt(x,y){
  isLongPress = true;
  longPressTimer = setInterval(()=>{
    spawnTrailHeart(x,y);
  },CONFIG.longPressSpurtInterval);
}
function stopLongPressSpurt(){
  isLongPress = false;
  clearInterval(longPressTimer);
}

//点击事件
let clickPos = {x:0,y:0};
document.body.addEventListener('mousedown',(e)=>{
  tryPlayMusic();
  clickPos.x = e.clientX;
  clickPos.y = e.clientY;
  longPressTimer = setTimeout(()=>{
    startLongPressSpurt(e.clientX,e.clientY);
  },300);
});
document.body.addEventListener('mouseup',()=>{
  clearTimeout(longPressTimer);
  if(!isLongPress){
    spawnHeartFirework(clickPos.x,clickPos.y);
    spawnRipple(clickPos.x,clickPos.y);
  }
  stopLongPressSpurt();
});
document.body.addEventListener('mouseleave',()=>{
  clearTimeout(longPressTimer);
  stopLongPressSpurt();
});

//背景粒子定时生成
setInterval(createLeafParticle, CONFIG.leafInterval);
setInterval(createStarDust, CONFIG.starInterval);
</script>
</body>
</html>
